downloader:
  cookies_file: 'cookies.txt'
  cookies_from_browser: ''
  format: ''
  fragment_retries: 50
  max_download_attempts: 3
  proxy: ''
  quality: best
  retries: 30
  socket_timeout: 60
  timeout: 7200
output_dir: ./output
subtitles:
  auto_subtitle:
    max_noise_ratio: 0.1
    min_coverage: 0.5
  enabled: true
  languages:
  - zh
  - zh-Hans
  - zh-Hant
  - en
  prefer_manual: true
summarizer:
  api_provider: deepseek
  base_url: ''
  custom_prompt: ''
  max_chunk_chars: 80000
  max_tokens: 8192
  model: 'deepseek-flash'
  # 2026-09-13 修复：V4.1 Flash 内测版（expires-on-0910）已于 09-10 到期，
  # 官方模型列表现仅剩 deepseek-flash 和 deepseek-v4-pro，正式版改名为 deepseek-flash。
  # max_tokens 从 4096 提到 8192：推理模型的思考过程也占该预算，太小会导致正文为空。
  multi_speaker: false
  output_formats:
  - md
  polish_model: ''
  summary_styles:
  - auto
  # - knowledge_points
  # - steps
  # - core_ideas
  # - expert
  # - custom
translation:
  target_lang: zh
whisper:
  compute_type: float16
  device: cuda
  hotwords: ''
  initial_prompt: ''
  language: auto
  vad_enabled: true
