# ===========================================
# Video-to-Doc 配置文件
# ===========================================

# 输出根目录（相对路径相对于项目根目录）
output_dir: ./output

# 转写设置
whisper:
  language: auto               # 转写语言，auto=自动检测
  device: cuda                  # cuda / cpu
  compute_type: float16         # float16（GPU）/ int8（CPU）

# 总结设置
summarizer:
  provider: openai              # openai / ollama
  base_url: https://api.deepseek.com  # API 地址（以下为常用国内服务商）
                                  # DeepSeek:     https://api.deepseek.com
                                  # 智谱:         https://open.bigmodel.cn/api/paas/v4
                                  # 通义千问:     https://dashscope.aliyuncs.com/compatible-mode/v1
                                  # 月之暗面:     https://api.moonshot.cn/v1
  model: deepseek-v4-pro         # DeepSeek: deepseek-v4-pro / deepseek-v4-flash
  polish_model: deepseek-v4-flash   # 标点分段专用模型（留空复用 model；若指定则需在当前服务商存在）
  max_chunk_chars: 80000          # 分段阈值（字符数），超过此长度自动分段总结
  max_tokens: 4096               # 单次回复最大 token 数
  summary_style: auto            # auto / knowledge_points / steps / core_ideas / expert
  output_formats:                 # 输出格式（可多选）
    - md
    # - txt
    # - html

# 说话人分离（可选，需安装 pyannote.audio）
diarization:
  enabled: false                 # true 启用
  hf_token: ""                   # HuggingFace Token，也支持 .env 中 HF_TOKEN
  min_speakers: 2                # 预估最少说话人数
  max_speakers: 5                # 预估最多说话人数
  min_turn_duration: 1.5         # 最短说话轮次（秒），短于此值的 pyannote turn 会平滑合并

# 翻译（可选，用于外文视频输出汉化文档和字幕）
translation:
  target_lang: zh               # 目标语言，zh=中文，en=英文，ja=日文等

# 字幕优先提取（可选，优先使用视频平台字幕代替 Whisper 转写）
subtitles:
  enabled: true                  # true 启用字幕优先提取
  languages:                     # 首选语言，按优先级排列
    - zh
    - zh-Hans
    - zh-Hant
    - en
  prefer_manual: true            # true=优先人工字幕，质量更高
  fallback_to_whisper: true      # true=字幕不可用或质量不达标时回退 Whisper
  auto_subtitle:                 # 自动字幕质量阈值
    min_coverage: 0.50           # 最低覆盖率（0-1），低于此值回退 Whisper
    max_noise_ratio: 0.10        # 最大噪音占比（0-1），[Music] 等非语音标签比例

# 下载设置
downloader:
  format: bestvideo[height<=1080]+bestaudio/best  # 视频质量
  cookies_file: ""              # Cookie 文件路径（如需下载会员视频）
  timeout: 7200                 # 下载超时（秒），默认 2 小时
