# ===========================================
# Video-to-Doc 配置文件
# ===========================================

# 输出根目录（相对路径相对于项目根目录）
output_dir: ./output

# 转写设置
whisper:
  language: zh                  # 转写语言，auto=自动检测
  device: cuda                  # cuda / cpu
  compute_type: float16         # float16（GPU）/ int8（CPU）

# 总结设置
summarizer:
  provider: openai              # openai / ollama
  base_url: https://api.deepseek.com  # API 地址（以下为常用国内服务商）
                                  # DeepSeek:     https://api.deepseek.com
                                  # 智谱:         https://open.bigmodel.cn/api/paas/v4
                                  # 通义千问:     https://dashscope.aliyuncs.com/compatible-mode/v1
                                  # 月之暗面:     https://api.moonshot.cn/v1
  model: deepseek-v4-pro         # DeepSeek: deepseek-v4-pro / deepseek-v4-flash
                                  # 智谱: glm-4-flash / 通义: qwen-turbo / 月之暗面: moonshot-v1-8k
  max_chunk_chars: 80000          # 分段阈值（字符数），超过此长度自动分段总结
  max_tokens: 4096               # 单次回复最大 token 数
  summary_style: auto            # auto / knowledge_points / steps / core_ideas
  output_formats:                 # 输出格式（可多选）
    - md
    # - txt
    # - html

# 说话人分离（可选，需安装 whisperx）
diarization:
  enabled: false                 # true 启用
  hf_token: ""                   # HuggingFace Token，也支持 .env 中 HF_TOKEN
  min_speakers: 2                # 预估最少说话人数
  max_speakers: 5                # 预估最多说话人数

# 下载设置
downloader:
  format: bestvideo[height<=1080]+bestaudio/best  # 视频质量
  cookies_file: ""              # Cookie 文件路径（如需下载会员视频）
  timeout: 7200                 # 下载超时（秒），默认 2 小时
