downloader:
  cookies_file: 'cookies.txt'
  cookies_from_browser: ''
  format: ''
  fragment_retries: 50
  max_download_attempts: 3
  proxy: ''
  quality: best
  retries: 30
  socket_timeout: 60
  timeout: 7200
output_dir: ./output
subtitles:
  auto_subtitle:
    max_noise_ratio: 0.1
    min_coverage: 0.5
  enabled: true
  languages:
  - zh
  - zh-Hans
  - zh-Hant
  - en
  prefer_manual: true
summarizer:
  api_provider: deepseek
  base_url: ''
  custom_prompt: ''
  max_chunk_chars: 80000
  max_tokens: 4096
  model: ''
  multi_speaker: false
  output_formats:
  - md
  polish_model: ''
  summary_styles:
  - auto
  # - knowledge_points
  # - steps
  # - core_ideas
  # - expert
  # - custom
translation:
  target_lang: zh
whisper:
  compute_type: float16
  device: cuda
  hotwords: ''
  initial_prompt: ''
  language: auto
  vad_enabled: true
